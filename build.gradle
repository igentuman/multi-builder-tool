plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

version = '1.3.0' // Increment version
group = 'igentuman.mbtool'

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

base {
    archivesName = 'MultiBuilder-26.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            serverData()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Update configurations
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { // JEI
        url "https://dvs1.progwml6.com/files/maven"
    }
    maven { // TOP
        url "https://cursemaven.com"
    }
    maven { url 'https://maven.blamejared.com' }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name 'Modmaven'
        url 'https://modmaven.dev/'
        content {
            includeGroup 'mekanism'
        }
    }
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven { url "https://maven.architectury.dev" }
}

// Update dependencies
dependencies {
    implementation "curse.maven:applied-energistics-2-223794:8257570"
    implementation "curse.maven:guideme-1173950:8204880"

    // Mekanism - update when NeoForge version is available
    if (project.hasProperty('mekanism_version')) {
        implementation "mekanism:Mekanism:${mekanism_version}"
    }

    implementation "curse.maven:jei-238222:9384706"
    implementation "curse.maven:kubejs-238086:9396057"
    implementation "curse.maven:rhino-416294:8463898"
    implementation "curse.maven:pf-emi-1654612:9587229"

    implementation "curse.maven:nuclearcraft-neoteric-840010:9790070"
    implementation "curse.maven:nuclear-radiation-1148833:9789517"

    implementation "curse.maven:better-advanced-tooltips-1637623:9148547"
    implementation "curse.maven:architectury-api-419699:9651460"
    implementation "curse.maven:ftb-teams-forge-404468:9405340"
    implementation "curse.maven:ftb-quests-forge-289412:9456215"
    implementation "curse.maven:ftb-library-forge-404465:9456005"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
