plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

// Update version and archivesBaseName
version = '1.3.0' // Increment version
group = 'igentuman.mbtool'

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

base {
    archivesName = 'MultiBuilder-26.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            serverData()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Update configurations
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { // JEI
        url "https://dvs1.progwml6.com/files/maven"
    }
    maven { // TOP
        url "https://cursemaven.com"
    }
    maven { url 'https://maven.blamejared.com' }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name 'Modmaven'
        url 'https://modmaven.dev/'
        content {
            includeGroup 'mekanism'
        }
    }
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven { url "https://maven.architectury.dev" }
}

// Update dependencies
dependencies {

    // Update dependencies with NeoForge versions
    // JEI
    // compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    implementation "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
    implementation "curse.maven:applied-energistics-2-223794:8257570"
    implementation "curse.maven:guideme-1173950:8204880"

    // Mekanism - update when NeoForge version is available
    if (project.hasProperty('mekanism_version')) {
        implementation "mekanism:Mekanism:${mekanism_version}"
    }

    // Botania - update when NeoForge version is available
    if (project.hasProperty('botania_version')) {
        compileOnly "vazkii.botania:Botania:${botania_version}:api"
        compileOnly "vazkii.botania:Botania:${botania_version}"
    }

    // Patchouli - update when NeoForge version is available
    if (project.hasProperty('patchouli_version')) {
        compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}:api"
        compileOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
    }

    //implementation "curse.maven:architectury-api-419699:5786327"

    // KubeJS - update when NeoForge version is available
    if (project.hasProperty('kubejs_version')) {
        implementation "curse.maven:kubejs-238086:${kubejs_version}"
    }

    // Rhino - update when NeoForge version is available
    if (project.hasProperty('rhino_version')) {
        implementation "curse.maven:rhino-416294:${rhino_version}"
    }

    // Masterful Machinery - update when NeoForge version is available
    // implementation "curse.maven:masterful-machinery-423476:NEOFORGE_VERSION"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}