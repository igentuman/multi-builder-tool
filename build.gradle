plugins {
    id 'net.neoforged.moddev' version '1.0.17'
    id 'idea'
}

version = "${mod_version}"
group = 'igentuman.mbtool'
base {
    archivesName = "MultiBuilderTool-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = project.neoforge_version

    // Adjust mappings to official as requested
    // The new plugin handles this via the mappings property if needed, 
    // but by default it uses official if not specified.
    // We can leave it as is or specify it.

    runs {
        client {
            client()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mbtool'
        }

        server {
            server()
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'mbtool'
        }

        data {
            data()
            programArguments.addAll '--mod', 'mbtool', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        mbtool {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url "https://minecraft.curseforge.com/api/maven/" }
    maven { url "https://maven.blamejared.com" }
    maven { url "https://jitpack.io" }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url "https://squiddev.cc/maven/" }
    maven { url "https://maven.tterrag.com/" }
    maven { url "https://modmaven.dev/" }
    maven { url "https://maven.firstdarkdev.xyz/snapshots/" }
    maven { url "https://maven.architectury.dev" }
    maven { url "https://maven.saps.dev/minecraft" }
    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }

    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }

    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
}

dependencies {
    // NeoForge 1.21+ uses a different way to handle dependencies. 
    // The plugin handles the 'minecraft' dependency automatically based on 'neoForge.version'.

    // Examples of updating dependencies for 1.21.1
    // Many of these might need updated versions or might not be available yet.
    // I will use some placeholders for now or try to use what's likely available.

    // runtimeOnly "curse.maven:immersive-petroleum-268250:7512547"
    // runtimeOnly "curse.maven:nbtedit-reborn-678133:5984630"
    
    // Architectury for 1.21.1
    implementation "dev.architectury:architectury-neoforge:${architectury_version}"

    // JEI for 1.21.1
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    implementation "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Mekanism for 1.21.1
    implementation "mekanism:Mekanism:${minecraft_version}-${mekanism_version}"
    implementation "mekanism:Mekanism:${minecraft_version}-${mekanism_version}:generators"

    // KubeJS for 1.21.1
    implementation "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    implementation "curse.maven:rhino-416294:6886923"

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "mbtool",
                "Specification-Vendor"    : "igentuman",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "igentuman",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "mbtool.mixins.json"
        ])
    }
}

/*mixin {
    add sourceSets.main, "mbtool.refmap.json"
    config "mbtool.mixins.json"
}*/

jar.enabled = true

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

configurations {
    shaded {
        transitive = false
    }
}

test {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            'version': version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

