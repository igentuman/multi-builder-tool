name: Build

on:
  push:
    branches: [ "26.1" ]
  pull_request:
    branches: [ "26.1" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" build

      - name: Archive build
        uses: actions/upload-artifact@v4
        with:
          name: Mod JARs
          path: build/libs/*.jar
          if-no-files-found: error
